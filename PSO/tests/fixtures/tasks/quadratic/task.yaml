task:
  name: quadratic
  version: v1
  prompt: prompt.md
  schemas:
    - result.schema.json
agent:
  model: deterministic-test
  skills: []
  stage_timeout_seconds: 30.0
wiki:
  path: null
  read_only: true
  max_results: 10
pso:
  population_size: 3
  iterations: 2
  run_seed: 42
  cognitive_coefficient: 2.05
  social_coefficient: 2.05
  constriction_factor: 0.72984
  velocity_clamp: 0.2
  topology:
    type: ring
    neighborhood_radius: 1
concurrency:
  agents: 1
  evaluations: 1
retry:
  agent_schema_corrections: 1
  transient_resource_retries: 1
  consecutive_failures_before_resample: 1
thread:
  max_turns: 4
  max_context_tokens: 1024
snapshot:
  max_files: 10000
  max_file_bytes: 67108864
  max_total_bytes: 536870912
storage:
  runs_directory: runs
plugins:
  position_space: tests.fixtures.tasks.quadratic.plugin:create_position_space
  task_adapter: tests.fixtures.tasks.quadratic.plugin:create_task_adapter
  evaluator: tests.fixtures.tasks.quadratic.plugin:create_evaluator
  tool_provider: tests.fixtures.tasks.quadratic.plugin:create_tool_provider
  source_files:
    - helper.py
